name: Release

on:
  push:
    tags:
      - "mosh-*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04

    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - id: meta
      name: "validate release tag"
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME}"
        version="$(sed -n 's/AC_INIT(\[[^]]*\], \[\([^]]*\)\].*/\1/p' configure.ac)"
        canonical="mosh-${version}"
        customized="mosh-${version}-customized"

        if [ "${tag}" != "${canonical}" ] && [ "${tag}" != "${customized}" ]; then
          echo "Expected '${canonical}' or '${customized}', got '${tag}'" >&2
          exit 1
        fi

        release_version="${tag#mosh-}"
        base_version="${release_version%-customized}"

        echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"

        if [[ "${base_version}" == *-* ]]; then
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        fi

  source-dist:
    needs: validate-tag
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: "setup linux build environment"
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libprotobuf-dev libutempter-dev autoconf automake nettle-dev

    - name: "generate build scripts"
      run: ./autogen.sh

    - name: "build source tarball"
      run: |
        ./configure --enable-examples
        make -j"$(nproc)" V=1
        make V=1 dist

    - name: "smoke test source tarball"
      run: |
        set -euo pipefail
        src_tarball=$(ls mosh-*.tar.gz | head -n 1)
        smoke_dir=$(mktemp -d)
        tar -C "$smoke_dir" -xzf "$src_tarball"
        src_dir=$(find "$smoke_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)
        cd "$src_dir"
        ./configure --enable-examples
        make -j"$(nproc)" V=1

    - name: "collect source artifact"
      run: |
        mkdir -p dist
        src_tarball=$(ls mosh-*.tar.gz | head -n 1)
        cp "$src_tarball" "dist/mosh-${{ needs.validate-tag.outputs.release_version }}-src.tar.gz"

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-source
        path: dist/*
        if-no-files-found: error

  build-binaries:
    needs: validate-tag
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-22.04
            os: linux
            arch: x64
          - id: linux-arm64
            runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
          - id: macos-arm64
            runner: macos-14
            os: macos
            arch: arm64

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: "setup linux build environment"
      if: ${{ matrix.os == 'linux' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libprotobuf-dev autoconf automake nettle-dev

    - name: "build and package linux artifacts"
      if: ${{ matrix.os == 'linux' }}
      run: |
        set -euo pipefail
        ./autogen.sh
        ./configure --prefix=/usr/local --enable-examples --with-utempter=no
        make -j"$(nproc)" V=1

        rm -rf stage pkg dist
        make DESTDIR="$PWD/stage" install
        mkdir -p pkg/bin pkg/share/man/man1 dist

        cp stage/usr/local/bin/mosh pkg/bin/
        cp stage/usr/local/bin/mosh-client pkg/bin/
        cp stage/usr/local/bin/mosh-server pkg/bin/
        cp stage/usr/local/share/man/man1/mosh*.1 pkg/share/man/man1/ || true
        cp COPYING pkg/ 2>/dev/null || true
        cp README* pkg/ 2>/dev/null || true

        tar -C pkg -czf "dist/mosh-${{ needs.validate-tag.outputs.release_version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" .

        pkg/bin/mosh-client --version
        pkg/bin/mosh-server --version

    - name: "setup macos build environment"
      if: ${{ matrix.os == 'macos' }}
      run: brew install autoconf automake pkg-config protobuf ncurses

    - name: "build and package macos artifacts"
      if: ${{ matrix.os == 'macos' }}
      run: |
        set -euo pipefail
        pushd macosx
        env ZERO_AR_DATE=1 MACOSX_DEPLOYMENT_TARGET=11.0 MOSH_DEP_TOOLCHAIN=homebrew ./build.sh
        popd

        rm -rf pkg release_pkg dist
        mkdir -p pkg/bin pkg/lib pkg/share/man/man1 release_pkg/man/man1 dist

        cp macosx/prefix/local/bin/mosh pkg/bin/
        cp macosx/prefix/local/bin/mosh-client pkg/bin/
        cp macosx/prefix/local/bin/mosh-server pkg/bin/
        cp -R macosx/prefix/local/lib/. pkg/lib/
        cp macosx/prefix/local/share/man/man1/mosh*.1 pkg/share/man/man1/ || true
        cp COPYING pkg/ 2>/dev/null || true
        cp README* pkg/ 2>/dev/null || true

        # Keep a flat layout for the macOS release tarball so
        # `mise install github:unstableneutron/mosh` can run binaries directly
        # from the extracted tool directory.
        cp pkg/bin/mosh release_pkg/
        cp pkg/bin/mosh-client release_pkg/
        cp pkg/bin/mosh-server release_pkg/
        find pkg/lib -maxdepth 1 -type f -name '*.dylib' -exec cp {} release_pkg/ \;
        cp pkg/share/man/man1/mosh*.1 release_pkg/man/man1/ || true
        cp COPYING release_pkg/ 2>/dev/null || true
        cp README* release_pkg/ 2>/dev/null || true

        for prog in release_pkg/mosh-client release_pkg/mosh-server; do
          while IFS= read -r dep; do
            base=$(basename "$dep")
            install_name_tool -change "$dep" "@executable_path/${base}" "$prog"
          done < <(otool -L "$prog" | awk '{print $1}' | grep '^@executable_path/../lib/' || true)
        done

        if which -s codesign; then
          for prog in release_pkg/mosh-client release_pkg/mosh-server; do
            codesign --remove-signature "$prog" > /dev/null 2>&1 || true
            codesign --force --sign - "$prog" > /dev/null
          done
        fi

        tar -C release_pkg -czf "dist/mosh-${{ needs.validate-tag.outputs.release_version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" .

        tarball="dist/mosh-${{ needs.validate-tag.outputs.release_version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
        smoke_dir=$(mktemp -d)
        tar -C "$smoke_dir" -xzf "$tarball"
        "$smoke_dir/mosh-client" --version
        "$smoke_dir/mosh-server" --version
        PATH="$smoke_dir:$PATH" "$smoke_dir/mosh" --help >/dev/null
        rm -rf "$smoke_dir"

        installer_pkg=$(find macosx -maxdepth 1 -type f -name '*.pkg' -print -quit)
        if [ -n "$installer_pkg" ]; then
          cp "$installer_pkg" "dist/mosh-${{ needs.validate-tag.outputs.release_version }}-installer.pkg"
        fi

        check_targets=(release_pkg/mosh-client release_pkg/mosh-server)
        while IFS= read -r dylib; do
          check_targets+=("$dylib")
        done < <(find release_pkg -maxdepth 1 -type f -name '*.dylib' -print | sort)

        unresolved=$(otool -L "${check_targets[@]}" | awk '{print $1}' | grep -E '(^@rpath/|^@executable_path/\.\./lib/|^/opt/homebrew/|^/usr/local/|^/opt/zerobrew/|^/opt/local/)' || true)
        if [ -n "$unresolved" ]; then
          printf 'Unexpected dylib references detected:\n%s\n' "$unresolved" >&2
          exit 1
        fi

        release_pkg/mosh-client --version
        release_pkg/mosh-server --version

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-${{ matrix.id }}
        path: dist/*
        if-no-files-found: error

  publish-release:
    permissions:
      contents: write
    needs:
      - validate-tag
      - source-dist
      - build-binaries
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        path: release-assets

    - name: "prepare release files"
      run: |
        set -euo pipefail
        mkdir -p dist
        find release-assets -maxdepth 2 -type f -exec cp {} dist/ \;

        expected=(
          "mosh-${{ needs.validate-tag.outputs.release_version }}-src.tar.gz"
          "mosh-${{ needs.validate-tag.outputs.release_version }}-linux-x64.tar.gz"
          "mosh-${{ needs.validate-tag.outputs.release_version }}-linux-arm64.tar.gz"
          "mosh-${{ needs.validate-tag.outputs.release_version }}-macos-arm64.tar.gz"
        )
        for asset in "${expected[@]}"; do
          if [ ! -f "dist/${asset}" ]; then
            echo "Missing expected asset: ${asset}" >&2
            exit 1
          fi
        done

        (cd dist && sha256sum * > SHA256SUMS)

    - name: "upload release"
      uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
      with:
        draft: false
        prerelease: ${{ needs.validate-tag.outputs.prerelease }}
        generate_release_notes: true
        files: dist/*
        fail_on_unmatched_files: true
